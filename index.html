const PRELOADED_TICKS = [];

const buildPreloaded = () => {
  const out = {};
  const stamp = { done: true, by: "preload", at: new Date("2026-08-10T00:00:00").toISOString() };
  PRELOADED_TICKS.forEach(id => { out[id] = stamp; });
  return out;
};

// ============ HELPERS ============
const allTasksFlat = () => {
  const out = [];
  DAYS.forEach(d => {
    PERSONS.forEach(p => {
      (d.tasks[p.key] || []).forEach(t => out.push({ ...t, day: d.day, person: p.key }));
    });
  });
  return out;
};

const criticalsDoneThrough = (targetDay, completed) => {
  const all = allTasksFlat();
  const criticalsBefore = all.filter(t => t.day <= targetDay && t.critical);
  const done = criticalsBefore.filter(t => completed[t.id]?.done);
  return {
    total: criticalsBefore.length,
    done: done.length,
    remaining: criticalsBefore.length - done.length,
    complete: done.length === criticalsBefore.length,
  };
};

// ============ LOCAL CACHE (survives wifi drops / reloads) ============
// This is a real deployed website, not a Claude artifact, so localStorage is safe to use here.
const LOCAL_CACHE_PREFIX = "kemp-inspection-cache-";

const readLocalCache = (blobId) => {
  if (!blobId) return null;
  try {
    const raw = window.localStorage.getItem(LOCAL_CACHE_PREFIX + blobId);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
};

const writeLocalCache = (blobId, data) => {
  if (!blobId) return;
  try {
    window.localStorage.setItem(LOCAL_CACHE_PREFIX + blobId, JSON.stringify({ ...data, cachedAt: new Date().toISOString() }));
  } catch {
    // Storage full or unavailable — fail silently, sync will retry over network
  }
};

// Flaky wifi can leave a request hanging for a long time rather than failing cleanly.
// This wraps fetch with a hard timeout so the app gives up and falls back to cached
// data quickly instead of showing "syncing…" indefinitely.
const FETCH_TIMEOUT_MS = 8000;
const fetchWithTimeout = (url, options = {}) => {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timeoutId));
};

// ============ MAIN APP ============
function App() {
  const initialBlobId = (() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get(BLOB_ID_PARAM) || "";
    } catch { return ""; }
  })();

  // On first render, try to warm-start from local cache so a reload during a wifi
  // outage shows the last known state instead of a blank/zeroed list.
  const cachedOnLoad = readLocalCache(initialBlobId);

  const [completed, setCompleted] = useState(cachedOnLoad?.completed || {});
  const [activeDay, setActiveDay] = useState(cachedOnLoad?.activeDay || 1);
  const [catchUpMode, setCatchUpMode] = useState(cachedOnLoad?.catchUpMode || false);
  const [activePerson, setActivePerson] = useState(null);
  const [activeView, setActiveView] = useState("today");
  const [expandedDays, setExpandedDays] = useState({});
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSync, setLastSync] = useState(null);
  const [showWelcome, setShowWelcome] = useState(true);
  const [blobId, setBlobId] = useState(initialBlobId);
  const [showBlobSetup, setShowBlobSetup] = useState(!initialBlobId);
  const [blobError, setBlobError] = useState("");
  const [showDayPicker, setShowDayPicker] = useState(false);
  const [usingCachedData, setUsingCachedData] = useState(!!cachedOnLoad);
  // CRITICAL SAFETY GUARD: we must never PUT to the server until we have
  // successfully READ from it at least once. Otherwise a tap made while the
  // initial load is still pending (or has failed due to bad wifi) would send an
  // almost-empty object and destroy everyone else's progress.
  const [hasLoadedOnce, setHasLoadedOnce] = useState(false);
  const hasLoadedOnceRef = useRef(false);
  const pendingWriteRef = useRef(null);
  const lastSavedRef = useRef("");
  const writeQueueRef = useRef(null);
  const saveSharedRef = useRef(null);

  const today = new Date();
  const daysToInspection = Math.max(0, Math.ceil((INSPECTION_DATE - today) / (1000 * 60 * 60 * 24)));

  const activeDayRef = useRef(activeDay);
  const catchUpModeRef = useRef(catchUpMode);
  const completedRef = useRef(completed);
  useEffect(() => { activeDayRef.current = activeDay; }, [activeDay]);
  useEffect(() => { catchUpModeRef.current = catchUpMode; }, [catchUpMode]);
  useEffect(() => { completedRef.current = completed; }, [completed]);

  const blobUrl = blobId ? `${JSONBLOB_API}/${blobId}` : null;

  const createBlob = useCallback(async () => {
    try {
      setSyncStatus("syncing");
      setBlobError("");
      const initialState = { completed: buildPreloaded(), activeDay: 1, catchUpMode: false, createdAt: new Date().toISOString() };
      const res = await fetchWithTimeout(JSONBLOB_API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(initialState),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const location = res.headers.get("Location") || res.headers.get("location");
      let newId = "";
      if (location) {
        const parts = location.split("/");
        newId = parts[parts.length - 1];
      }
      if (!newId) {
        const data = await res.json().catch(() => null);
        if (data && data.id) newId = data.id;
      }
      if (!newId) throw new Error("Could not determine new blob ID");
      setBlobId(newId);
      setCompleted(buildPreloaded());
      // We just created this blob, so we definitively know its contents — writes are safe.
      hasLoadedOnceRef.current = true;
      setHasLoadedOnce(true);
      setShowBlobSetup(false);
      try {
        const url = new URL(window.location.href);
        url.searchParams.set(BLOB_ID_PARAM, newId);
        window.history.replaceState({}, "", url.toString());
      } catch {}
      setSyncStatus("idle");
      setLastSync(new Date());
    } catch (e) {
      setBlobError("Couldn't create shared list. Check your internet and try again.");
      setSyncStatus("error");
    }
  }, []);

  const loadShared = useCallback(async () => {
    if (!blobUrl) return;
    if (writeQueueRef.current) return;
    try {
      setSyncStatus("syncing");
      const res = await fetchWithTimeout(blobUrl, {
        method: "GET",
        headers: { "Accept": "application/json" },
      });
      if (!res.ok) {
        if (res.status === 404) {
          setBlobError("This shared list no longer exists.");
          setSyncStatus("error");
          return;
        }
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      const incomingCompleted = data.completed || {};
      const incomingDay = typeof data.activeDay === "number" ? data.activeDay : 1;
      const incomingCatchUp = !!data.catchUpMode;

      const localCompleted = completedRef.current;
      const merged = { ...incomingCompleted };
      Object.keys(localCompleted).forEach(id => {
        const local = localCompleted[id];
        const remote = incomingCompleted[id];
        if (!remote) {
          merged[id] = local;
        } else if (local.at && remote.at && new Date(local.at) > new Date(remote.at)) {
          merged[id] = local;
        } else {
          merged[id] = remote;
        }
      });

      const mergedDiffersFromIncoming = JSON.stringify(merged) !== JSON.stringify(incomingCompleted);
      const snapshot = JSON.stringify({ c: merged, d: incomingDay, m: incomingCatchUp });
      if (snapshot !== lastSavedRef.current) {
        setCompleted(merged);
        setActiveDay(incomingDay);
        setCatchUpMode(incomingCatchUp);
        lastSavedRef.current = snapshot;
        if (mergedDiffersFromIncoming && saveSharedRef.current) {
          saveSharedRef.current(merged, incomingDay, incomingCatchUp);
        }
      }
      // Successful sync — cache this confirmed state and clear the "showing cached data" flag
      writeLocalCache(blobId, { completed: merged, activeDay: incomingDay, catchUpMode: incomingCatchUp });
      setUsingCachedData(false);
      // We now know what the server holds, so writes are safe from here on.
      if (!hasLoadedOnceRef.current) {
        hasLoadedOnceRef.current = true;
        setHasLoadedOnce(true);
        // If the user tapped while we were still loading, that change was held
        // back. Merge it onto the freshly-loaded server state and send it now.
        if (pendingWriteRef.current) {
          const held = pendingWriteRef.current;
          pendingWriteRef.current = null;
          const reconciled = { ...merged };
          Object.keys(held.completed).forEach(id => {
            const heldEntry = held.completed[id];
            const serverEntry = merged[id];
            if (!serverEntry) {
              reconciled[id] = heldEntry;
            } else if (heldEntry.at && serverEntry.at && new Date(heldEntry.at) > new Date(serverEntry.at)) {
              reconciled[id] = heldEntry;
            }
          });
          setCompleted(reconciled);
          if (saveSharedRef.current) {
            saveSharedRef.current(reconciled, held.activeDay, held.catchUpMode);
          }
        }
      }
      setSyncStatus("idle");
      setLastSync(new Date());
      setBlobError("");
    } catch (e) {
      setSyncStatus("offline");
    }
  }, [blobUrl, blobId]);

  const saveShared = useCallback((nextCompleted, nextActiveDay, nextCatchUp) => {
    if (!blobUrl) return;
    // Cache immediately on every local change, regardless of network — this is what
    // protects against the "wiped to 0" problem when wifi drops right after a tick.
    writeLocalCache(blobId, { completed: nextCompleted, activeDay: nextActiveDay, catchUpMode: nextCatchUp });

    // SAFETY: never write to the shared server until we have confirmed what it
    // already contains. Hold the change locally and flush it once the first
    // successful load completes.
    if (!hasLoadedOnceRef.current) {
      pendingWriteRef.current = { completed: nextCompleted, activeDay: nextActiveDay, catchUpMode: nextCatchUp };
      return;
    }

    if (writeQueueRef.current) clearTimeout(writeQueueRef.current);
    const payload = {
      completed: nextCompleted,
      activeDay: nextActiveDay,
      catchUpMode: nextCatchUp,
      updatedAt: new Date().toISOString(),
    };
    lastSavedRef.current = JSON.stringify({ c: nextCompleted, d: nextActiveDay, m: nextCatchUp });
    writeQueueRef.current = setTimeout(async () => {
      try {
        setSyncStatus("syncing");
        const res = await fetchWithTimeout(blobUrl, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        setSyncStatus("idle");
        setLastSync(new Date());
      } catch (e) {
        setSyncStatus("offline");
      } finally {
        writeQueueRef.current = null;
      }
    }, 400);
  }, [blobUrl, blobId]);

  useEffect(() => { saveSharedRef.current = saveShared; }, [saveShared]);

  useEffect(() => {
    if (!blobUrl) return;
    loadShared();
    const interval = setInterval(loadShared, POLL_MS);
    return () => clearInterval(interval);
  }, [loadShared, blobUrl]);

  const toggle = useCallback((taskId, person) => {
    setCompleted(prev => {
      const wasDone = prev[taskId]?.done;
      const stamp = { done: !wasDone, by: person || "anyone", at: new Date().toISOString() };
      const next = { ...prev, [taskId]: stamp };
      saveShared(next, activeDayRef.current, catchUpModeRef.current);
      return next;
    });
  }, [saveShared]);

  const changeDay = useCallback((newDay) => {
    setActiveDay(newDay);
    setShowDayPicker(false);
    saveShared(completedRef.current, newDay, catchUpModeRef.current);
  }, [saveShared]);

  const toggleCatchUp = useCallback(() => {
    setCatchUpMode(prev => {
      const next = !prev;
      saveShared(completedRef.current, activeDayRef.current, next);
      return next;
    });
  }, [saveShared]);

  const advanceDay = useCallback(() => {
    setActiveDay(prev => {
      const newDay = Math.min(prev + 1, DAYS.length);
      setCatchUpMode(false);
      saveShared(completedRef.current, newDay, false);
      return newDay;
    });
  }, [saveShared]);

  const stats = useMemo(() => {
    const all = allTasksFlat();
    const total = all.length;
    const done = all.filter(t => completed[t.id]?.done).length;
    const critical = all.filter(t => t.critical);
    const criticalDone = critical.filter(t => completed[t.id]?.done).length;
    const byPerson = {};
    PERSONS.forEach(p => {
      const tasks = all.filter(t => t.person === p.key);
      byPerson[p.key] = { total: tasks.length, done: tasks.filter(t => completed[t.id]?.done).length };
    });
    const byDay = {};
    DAYS.forEach(d => {
      const tasks = all.filter(t => t.day === d.day);
      byDay[d.day] = {
        total: tasks.length,
        done: tasks.filter(t => completed[t.id]?.done).length,
        critical: tasks.filter(t => t.critical).length,
        criticalDone: tasks.filter(t => t.critical && completed[t.id]?.done).length,
      };
    });
    return { total, done, criticalTotal: critical.length, criticalDone, byPerson, byDay };
  }, [completed]);

  const advanceCheck = useMemo(() => criticalsDoneThrough(activeDay, completed), [activeDay, completed]);
  const canAdvance = advanceCheck.complete && activeDay < DAYS.length;

  const visibleDays = useMemo(() => {
    if (activeView === "today") {
      if (catchUpMode) {
        const merged = {
          day: activeDay, label: "Catch-up", subtitle: `Unfinished from Day 1–${activeDay}`,
          tasks: Object.fromEntries(PERSONS.map(p => [p.key, []])),
        };
        DAYS.filter(d => d.day <= activeDay).forEach(d => {
          PERSONS.forEach(p => {
            (d.tasks[p.key] || []).forEach(t => {
              if (!completed[t.id]?.done) merged.tasks[p.key].push({ ...t, _fromDay: d.day });
            });
          });
        });
        PERSONS.forEach(p => {
          merged.tasks[p.key].sort((a, b) => {
            if (a.critical !== b.critical) return a.critical ? -1 : 1;
            return a._fromDay - b._fromDay;
          });
        });
        return [merged];
      }
      return DAYS.filter(d => d.day === activeDay);
    }
    if (activeView === "critical") {
      return DAYS.map(d => {
        const filteredTasks = {};
        Object.keys(d.tasks).forEach(p => {
          const filtered = d.tasks[p].filter(t => t.critical && !completed[t.id]?.done);
          if (filtered.length) filteredTasks[p] = filtered;
        });
        return Object.keys(filteredTasks).length ? { ...d, tasks: filteredTasks } : null;
      }).filter(Boolean);
    }
    if (activeView === "smell") {
      return DAYS.map(d => {
        const filteredTasks = {};
        Object.keys(d.tasks).forEach(p => {
          const filtered = d.tasks[p].filter(t => t.cat === "smell");
          if (filtered.length) filteredTasks[p] = filtered;
        });
        return Object.keys(filteredTasks).length ? { ...d, tasks: filteredTasks } : null;
      }).filter(Boolean);
    }
    return DAYS;
  }, [activeView, activeDay, catchUpMode, completed]);

  const filterByPerson = (tasks) => {
    if (!activePerson) return tasks;
    return { [activePerson]: tasks[activePerson] || [] };
  };

  if (showBlobSetup) {
    return <BlobSetupScreen
      onCreate={createBlob}
      onJoin={(id) => {
        setBlobId(id.trim());
        setShowBlobSetup(false);
        try {
          const url = new URL(window.location.href);
          url.searchParams.set(BLOB_ID_PARAM, id.trim());
          window.history.replaceState({}, "", url.toString());
        } catch {}
      }}
      error={blobError}
      syncing={syncStatus === "syncing"}
    />;
  }

  if (showWelcome && !activePerson) {
    return <WelcomeScreen
      onSelect={(p) => { setActivePerson(p); setShowWelcome(false); }}
      stats={stats}
      daysToInspection={daysToInspection}
      blobId={blobId}
      onResetBlob={() => { setShowBlobSetup(true); setBlobId(""); setCompleted({}); }}
    />;
  }

  const activeDayObj = DAYS.find(d => d.day === activeDay);

  return (
    <div className="min-h-screen w-full" style={{
      background: "radial-gradient(ellipse at top, #1a0b2e 0%, #0a0612 50%, #000 100%)",
      fontFamily: "'Instrument Sans', -apple-system, sans-serif",
      color: "#f5f5f7",
    }}>
      <header className="sticky top-0 z-30 backdrop-blur-xl" style={{
        background: "rgba(10, 6, 18, 0.92)",
        borderBottom: "1px solid rgba(255,255,255,0.08)",
      }}>
        <div className="px-4 pt-3 pb-2">
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="text-[10px] uppercase tracking-[0.2em] opacity-50">Inspection Aug 18</div>
              <div className="text-2xl italic leading-none mt-0.5" style={{ fontFamily: "'Instrument Serif', serif" }}>
                {daysToInspection === 0
                  ? <span className="not-italic text-base font-semibold" style={{ color: "#ec4899" }}>Inspection today</span>
                  : <>{daysToInspection} <span className="not-italic text-sm opacity-70">{daysToInspection === 1 ? "day" : "days"} left</span></>
                }
              </div>
            </div>
            <div className="flex items-center gap-2">
              <SyncIndicator status={syncStatus} lastSync={lastSync} />
              <button
                onClick={() => setShowWelcome(true)}
                className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold"
                style={{
                  background: PERSONS.find(p => p.key === activePerson)?.color,
                  color: "#000",
                }}
              >
                {PERSONS.find(p => p.key === activePerson)?.initial}
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2 mb-2.5">
            <button
              onClick={() => setShowDayPicker(true)}
              className="flex-1 flex items-center justify-between px-3 py-2 rounded-xl text-left transition-all active:scale-[0.98]"
              style={{
                background: catchUpMode ? "rgba(251,191,36,0.12)" : "rgba(255,255,255,0.06)",
                border: `1px solid ${catchUpMode ? "rgba(251,191,36,0.3)" : "rgba(255,255,255,0.08)"}`,
              }}
            >
              <div>
                <div className="text-[9px] uppercase tracking-[0.15em] opacity-50 leading-none mb-0.5">
                  {catchUpMode ? "Catch-up mode" : "Currently on"}
                </div>
                <div className="text-sm font-semibold leading-tight">
                  Day {activeDay} · {activeDayObj?.label}
                </div>
              </div>
              <ChevronDown size={14} opacity={0.4} />
            </button>
            <button
              onClick={toggleCatchUp}
              className="px-3 py-2 rounded-xl text-[10px] font-semibold uppercase tracking-wider transition-all active:scale-95"
              style={{
                background: catchUpMode ? "#fbbf24" : "rgba(255,255,255,0.06)",
                color: catchUpMode ? "#000" : "rgba(255,255,255,0.7)",
                border: `1px solid ${catchUpMode ? "#fbbf24" : "rgba(255,255,255,0.08)"}`,
              }}
            >
              {catchUpMode ? "Exit" : "Catch-up"}
            </button>
          </div>

          {!catchUpMode && activeDay < DAYS.length && (
            <button
              onClick={canAdvance ? advanceDay : undefined}
              disabled={!canAdvance}
              className="w-full flex items-center justify-between px-3 py-2 rounded-xl text-left transition-all active:scale-[0.98] mb-2.5"
              style={{
                background: canAdvance ? "linear-gradient(90deg, #10b981, #34d399)" : "rgba(255,255,255,0.03)",
                color: canAdvance ? "#000" : "rgba(255,255,255,0.5)",
                border: `1px solid ${canAdvance ? "transparent" : "rgba(255,255,255,0.06)"}`,
                opacity: canAdvance ? 1 : 0.7,
              }}
            >
              <div>
                <div className="text-[10px] uppercase tracking-[0.15em] font-semibold leading-none mb-0.5">
                  {canAdvance ? "Ready to advance" : "Cannot advance yet"}
                </div>
                <div className="text-[12px] font-medium leading-tight">
                  {canAdvance
                    ? `Tap to move to Day ${activeDay + 1}`
                    : `${advanceCheck.remaining} critical task${advanceCheck.remaining === 1 ? "" : "s"} blocking · Days 1–${activeDay}`}
                </div>
              </div>
              {canAdvance && <ArrowRight size={16} />}
            </button>
          )}

          <div className="flex items-center gap-2 mb-2.5">
            <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.08)" }}>
              <div
                className="h-full transition-all duration-500"
                style={{
                  width: `${(stats.done / stats.total) * 100}%`,
                  background: "linear-gradient(90deg, #ec4899, #a855f7, #3b82f6)",
                }}
              />
            </div>
            <div className="text-[11px] opacity-70 tabular-nums">{stats.done}/{stats.total}</div>
          </div>

          {stats.criticalDone < stats.criticalTotal && (
            <div className="flex items-center gap-2 text-[11px] mb-2.5">
              <AlertCircle size={12} style={{ color: "#fbbf24" }} />
              <span className="opacity-80">
                <span style={{ color: "#fbbf24", fontWeight: 600 }}>{stats.criticalTotal - stats.criticalDone}</span> critical items remaining
              </span>
            </div>
          )}

          <div className="flex gap-1.5 -mx-1 px-1 overflow-x-auto scrollbar-none">
            {[
              { key: "today", label: catchUpMode ? "Catch-up" : `Day ${activeDay}` },
              { key: "critical", label: "Critical only" },
              { key: "smell", label: "Smell control" },
              { key: "all", label: "All days" },
            ].map(v => (
              <button
                key={v.key}
                onClick={() => setActiveView(v.key)}
                className="px-3 py-1.5 rounded-full text-[11px] font-medium whitespace-nowrap transition-all"
                style={{
                  background: activeView === v.key ? "#fff" : "rgba(255,255,255,0.06)",
                  color: activeView === v.key ? "#000" : "rgba(255,255,255,0.7)",
                  border: "1px solid rgba(255,255,255,0.08)",
                }}
              >
                {v.label}
              </button>
            ))}
          </div>
        </div>

        <div className="pb-3 flex gap-1.5 overflow-x-auto scrollbar-none px-4">
          <button
            onClick={() => setActivePerson(null)}
            className="flex-shrink-0 py-2 px-3 rounded-lg text-[11px] font-medium transition-all min-w-[60px]"
            style={{
              background: !activePerson ? "rgba(255,255,255,0.12)" : "transparent",
              border: "1px solid rgba(255,255,255,0.08)",
              color: !activePerson ? "#fff" : "rgba(255,255,255,0.5)",
            }}
          >
            All
          </button>
          {PERSONS.map(p => {
            const ps = stats.byPerson[p.key];
            const pct = ps.total ? Math.round((ps.done / ps.total) * 100) : 0;
            return (
              <button
                key={p.key}
                onClick={() => setActivePerson(p.key)}
                className="flex-shrink-0 py-2 px-3 rounded-lg text-[11px] font-medium transition-all relative overflow-hidden min-w-[60px]"
                style={{
                  background: activePerson === p.key ? p.color : "rgba(255,255,255,0.04)",
                  border: `1px solid ${activePerson === p.key ? p.color : "rgba(255,255,255,0.08)"}`,
                  color: activePerson === p.key ? "#000" : "rgba(255,255,255,0.7)",
                }}
              >
                <div>{p.label}</div>
                <div className="text-[9px] opacity-70 mt-0.5 tabular-nums">{pct}%</div>
              </button>
            );
          })}
        </div>
      </header>

      {showDayPicker && (
        <div
          className="fixed inset-0 z-40 flex items-end justify-center"
          style={{ background: "rgba(0,0,0,0.6)", backdropFilter: "blur(8px)" }}
          onClick={() => setShowDayPicker(false)}
        >
          <div
            className="w-full max-w-md rounded-t-3xl p-5 pb-8"
            style={{
              background: "linear-gradient(180deg, #1a0b2e, #0a0612)",
              border: "1px solid rgba(255,255,255,0.08)",
              borderBottom: "none",
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="w-12 h-1 rounded-full mx-auto mb-5" style={{ background: "rgba(255,255,255,0.2)" }} />
            <div className="text-[10px] uppercase tracking-[0.2em] opacity-50 mb-1">Choose active day</div>
            <div className="text-2xl italic mb-1" style={{ fontFamily: "'Instrument Serif', serif" }}>
              What day are we on?
            </div>
            <div className="text-[11px] opacity-60 leading-relaxed mb-4">
              Tap any day to switch. Everyone's phone will follow.
            </div>
            <div className="space-y-2 max-h-[60vh] overflow-y-auto">
              {DAYS.map(d => {
                const ds = stats.byDay[d.day];
                const pct = ds.total ? Math.round((ds.done / ds.total) * 100) : 0;
                const isActive = d.day === activeDay;
                return (
                  <button
                    key={d.day}
                    onClick={() => changeDay(d.day)}
                    className="w-full flex items-center gap-3 p-3 rounded-xl text-left transition-all active:scale-[0.98]"
                    style={{
                      background: isActive ? "rgba(236,72,153,0.15)" : "rgba(255,255,255,0.03)",
                      border: `1px solid ${isActive ? "#ec4899" : "rgba(255,255,255,0.06)"}`,
                    }}
                  >
                    <div
                      style={{ fontFamily: "'Instrument Serif', serif" }}
                      className="text-3xl italic leading-none w-9 text-center"
                    >
                      {d.day}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-semibold">{d.label}</div>
                      <div className="text-[11px] opacity-60">{d.subtitle}</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[11px] opacity-80 tabular-nums">{pct}%</div>
                      <div className="text-[10px]" style={{ color: ds.criticalDone === ds.critical ? "#10b981" : "#fbbf24" }}>
                        {ds.criticalDone}/{ds.critical} crit
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
            <button
              onClick={() => setShowDayPicker(false)}
              className="w-full mt-4 py-3 rounded-xl text-sm font-semibold"
              style={{ background: "rgba(255,255,255,0.06)", color: "#fff", border: "1px solid rgba(255,255,255,0.08)" }}
            >
              Close
            </button>
          </div>
        </div>
      )}

      <main className="px-4 pb-32 pt-4">
        {(!hasLoadedOnce || usingCachedData || syncStatus === "offline") && (
          <div className="mb-5 p-4 rounded-2xl" style={{
            background: !hasLoadedOnce
              ? "linear-gradient(135deg, rgba(168,85,247,0.12), rgba(59,130,246,0.08))"
              : "linear-gradient(135deg, rgba(239,68,68,0.12), rgba(251,191,36,0.08))",
            border: `1px solid ${!hasLoadedOnce ? "rgba(168,85,247,0.3)" : "rgba(239,68,68,0.3)"}`,
          }}>
            <div className="flex items-center gap-2 mb-1">
              {!hasLoadedOnce
                ? <RefreshCw size={12} className="animate-spin" style={{ color: "#c4b5fd" }} />
                : <WifiOff size={12} style={{ color: "#f87171" }} />}
              <div className="text-[10px] uppercase tracking-[0.2em] font-semibold" style={{ color: !hasLoadedOnce ? "#c4b5fd" : "#f87171" }}>
                {!hasLoadedOnce ? "Loading everyone's progress" : syncStatus === "offline" ? "No connection" : "Showing saved copy"}
              </div>
            </div>
            <div className="text-[12px] opacity-80 leading-relaxed">
              {!hasLoadedOnce
                ? "Fetching the shared list. You can tick things now — they'll be saved and merged in as soon as this finishes. Nothing will be overwritten."
                : syncStatus === "offline"
                  ? "Can't reach the server right now. Your taps are being saved on this phone and will sync once wifi is back — nothing is lost."
                  : "Reconnecting to get the latest from everyone. What you see is this phone's last saved copy."}
            </div>
          </div>
        )}

        {catchUpMode && activeView === "today" && (
          <div className="mb-5 p-4 rounded-2xl" style={{
            background: "linear-gradient(135deg, rgba(251,191,36,0.15), rgba(168,85,247,0.08))",
            border: "1px solid rgba(251,191,36,0.3)",
          }}>
            <div className="flex items-center gap-2 mb-1">
              <Pause size={12} style={{ color: "#fbbf24" }} />
              <div className="text-[10px] uppercase tracking-[0.2em] font-semibold" style={{ color: "#fbbf24" }}>Catch-up mode</div>
            </div>
            <div className="text-xl italic mb-1" style={{ fontFamily: "'Instrument Serif', serif" }}>Finishing what's behind</div>
            <div className="text-[12px] opacity-80 leading-relaxed">
              Showing all unfinished tasks from Day 1 through Day {activeDay}, critical first.
            </div>
          </div>
        )}

        {visibleDays.length === 0 && (
          <div className="text-center py-20">
            <div className="text-3xl italic mb-2" style={{ fontFamily: "'Instrument Serif', serif" }}>All clear.</div>
            <div className="text-sm opacity-60">No tasks match this view.</div>
          </div>
        )}

        {visibleDays.map(d => {
          const dayStats = catchUpMode ? null : stats.byDay[d.day];
          const isPast = d.day < activeDay;
          const isToday = d.day === activeDay;
          const expanded = activeView !== "today" ? (expandedDays[d.day] ?? isToday) : true;

          return (
            <section key={d.day + (catchUpMode ? "-catchup" : "")} className="mb-5">
              {!catchUpMode && (
                <button
                  onClick={() => activeView !== "today" && setExpandedDays(prev => ({ ...prev, [d.day]: !expanded }))}
                  className="w-full text-left mb-3"
                  disabled={activeView === "today"}
                >
                  <div className="flex items-end justify-between">
                    <div className="flex items-baseline gap-3">
                      <div className="text-5xl italic leading-none" style={{
                        fontFamily: "'Instrument Serif', serif",
                        color: isToday ? "#ec4899" : isPast ? "rgba(255,255,255,0.25)" : "#fff",
                      }}>
                        {d.day}
                      </div>
                      <div>
                        <div className="text-[10px] uppercase tracking-[0.2em] opacity-50">Day {d.day}</div>
                        <div className="text-base font-semibold leading-tight">{d.label}</div>
                        <div className="text-[11px] opacity-50">{d.subtitle}</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {dayStats && (
                        <div className="text-right">
                          <div className="text-xs tabular-nums opacity-80">{dayStats.done}/{dayStats.total}</div>
                          {dayStats.critical > 0 && (
                            <div className="text-[10px] tabular-nums" style={{ color: dayStats.criticalDone === dayStats.critical ? "#10b981" : "#fbbf24" }}>
                              {dayStats.criticalDone}/{dayStats.critical} critical
                            </div>
                          )}
                        </div>
                      )}
                      {activeView !== "today" && (expanded ? <ChevronUp size={16} opacity={0.4} /> : <ChevronDown size={16} opacity={0.4} />)}
                    </div>
                  </div>
                  {dayStats && (
                    <div className="mt-2 h-0.5 rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.06)" }}>
                      <div className="h-full transition-all" style={{
                        width: `${(dayStats.done / dayStats.total) * 100}%`,
                        background: isPast ? "rgba(255,255,255,0.3)" : "linear-gradient(90deg, #ec4899, #a855f7)",
                      }} />
                    </div>
                  )}
                </button>
              )}

              {expanded && (
                <div className="space-y-4">
                  {Object.entries(filterByPerson(d.tasks)).map(([personKey, tasks]) => {
                    if (!tasks || tasks.length === 0) return null;
                    const person = PERSONS.find(p => p.key === personKey);
                    if (!person) return null;
                    return (
                      <div key={personKey}>
                        <div className="flex items-center gap-2 mb-2">
                          <div className="w-5 h-5 rounded-full flex items-center justify-center text-[9px] font-bold" style={{
                            background: person.color, color: "#000",
                          }}>
                            {person.initial}
                          </div>
                          <div className="text-[11px] uppercase tracking-[0.15em] font-semibold opacity-80">{person.label}</div>
                          <div className="flex-1 h-px" style={{ background: "rgba(255,255,255,0.06)" }} />
                          <div className="text-[10px] opacity-50 tabular-nums">
                            {tasks.filter(t => completed[t.id]?.done).length}/{tasks.length}
                          </div>
                        </div>
                        <div className="space-y-1.5">
                          {tasks.map(task => (
                            <TaskRow
                              key={task.id}
                              task={task}
                              completed={completed[task.id]}
                              onToggle={() => toggle(task.id, activePerson)}
                              accent={person.color}
                              showFromDay={catchUpMode}
                            />
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </section>
          );
        })}
      </main>

      <footer className="fixed bottom-0 left-0 right-0 px-4 py-3 backdrop-blur-xl text-center text-[10px] opacity-50" style={{
        background: "rgba(10, 6, 18, 0.85)",
        borderTop: "1px solid rgba(255,255,255,0.06)",
      }}>
        Synced across all phones · Tap your initial to switch person
      </footer>
    </div>
  );
}

function TaskRow({ task, completed, onToggle, accent, showFromDay }) {
  const isDone = completed?.done;
  const CatIcon = CAT_META[task.cat]?.icon || Circle;
  const checkedBy = completed?.by ? PERSONS.find(p => p.key === completed.by) : null;

  return (
    <button
      onClick={onToggle}
      className="w-full flex items-start gap-3 p-3 rounded-xl text-left transition-all active:scale-[0.98]"
      style={{
        background: isDone ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.04)",
        border: `1px solid ${task.critical && !isDone ? "rgba(251,191,36,0.25)" : "rgba(255,255,255,0.06)"}`,
      }}
    >
      <div className="mt-0.5 w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0 transition-all" style={{
        background: isDone ? accent : "transparent",
        border: `1.5px solid ${isDone ? accent : "rgba(255,255,255,0.25)"}`,
      }}>
        {isDone && <Check size={12} strokeWidth={3} color="#000" />}
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-[13px] leading-snug" style={{
          color: isDone ? "rgba(255,255,255,0.4)" : "#fff",
          textDecoration: isDone ? "line-through" : "none",
          textDecorationColor: "rgba(255,255,255,0.3)",
        }}>
          {task.text}
        </div>
        <div className="flex items-center gap-2 mt-1.5 flex-wrap">
          <div className="flex items-center gap-1 text-[9px] uppercase tracking-wider opacity-50">
            <CatIcon size={9} />
            <span>{CAT_META[task.cat]?.label || task.cat}</span>
          </div>
          {task.critical && !isDone && (
            <div className="text-[9px] uppercase tracking-wider font-semibold" style={{ color: "#fbbf24" }}>
              · Critical
            </div>
          )}
          {showFromDay && task._fromDay && (
            <div className="text-[9px] uppercase tracking-wider opacity-60">
              · Day {task._fromDay}
            </div>
          )}
          {checkedBy && isDone && checkedBy.key !== "preload" && (
            <div className="text-[9px] opacity-50 ml-auto">
              by {checkedBy.label}
            </div>
          )}
        </div>
      </div>
    </button>
  );
}

function SyncIndicator({ status, lastSync }) {
  const [, setTick] = useState(0);
  useEffect(() => {
    const i = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(i);
  }, []);
  const ago = lastSync ? Math.floor((Date.now() - lastSync.getTime()) / 1000) : null;
  const agoLabel = ago === null ? "—" : ago < 5 ? "just now" : ago < 60 ? `${ago}s` : `${Math.floor(ago/60)}m`;
  return (
    <div className="flex items-center gap-1.5 px-2 py-1 rounded-full text-[9px]" style={{
      background: "rgba(255,255,255,0.04)",
      border: "1px solid rgba(255,255,255,0.06)",
    }}>
      {status === "syncing" ? (
        <RefreshCw size={9} className="animate-spin" style={{ color: "#a855f7" }} />
      ) : status === "error" || status === "offline" ? (
        <WifiOff size={9} style={{ color: "#fbbf24" }} />
      ) : (
        <div className="w-1.5 h-1.5 rounded-full" style={{ background: "#10b981" }} />
      )}
      <span className="opacity-70 tabular-nums">{agoLabel}</span>
    </div>
  );
}

function WelcomeScreen({ onSelect, stats, daysToInspection, blobId, onResetBlob }) {
  const [copied, setCopied] = useState(false);
  const shareLink = useMemo(() => {
    if (!blobId) return "";
    try {
      const url = new URL(window.location.href);
      url.searchParams.set(BLOB_ID_PARAM, blobId);
      return url.toString();
    } catch { return ""; }
  }, [blobId]);

  const copyLink = () => {
    if (!shareLink) return;
    try {
      navigator.clipboard.writeText(shareLink);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {}
  };

  return (
    <div className="min-h-screen flex flex-col" style={{
      background: "radial-gradient(ellipse at top, #1a0b2e 0%, #0a0612 50%, #000 100%)",
      fontFamily: "'Instrument Sans', -apple-system, sans-serif",
      color: "#f5f5f7",
    }}>
      <div className="flex-1 flex flex-col justify-center px-6 py-12">
        <div className="text-[10px] uppercase tracking-[0.3em] opacity-50 mb-3">Aug 18 · 9:00 AM</div>
        <div className="text-6xl italic leading-[0.95] mb-2" style={{ fontFamily: "'Instrument Serif', serif" }}>
          The<br/>inspection<br/>plan.
        </div>
        <div className="flex items-baseline gap-3 mt-6 mb-12">
          <div className="text-7xl italic leading-none" style={{
            fontFamily: "'Instrument Serif', serif",
            background: "linear-gradient(135deg, #ec4899, #a855f7)",
            WebkitBackgroundClip: "text",
            WebkitTextFillColor: "transparent",
          }}>
            {daysToInspection}
          </div>
          <div className="text-sm opacity-60">days<br/>to go</div>
        </div>

        <div className="mb-10">
          <div className="text-[11px] uppercase tracking-[0.2em] opacity-50 mb-3">Overall progress</div>
          <div className="flex items-baseline gap-2 mb-3">
            <div className="text-4xl italic" style={{ fontFamily: "'Instrument Serif', serif" }}>{stats.done}</div>
            <div className="text-sm opacity-50">of {stats.total} tasks</div>
          </div>
          <div className="h-1.5 rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.08)" }}>
            <div className="h-full transition-all duration-700" style={{
              width: `${(stats.done / stats.total) * 100}%`,
              background: "linear-gradient(90deg, #ec4899, #a855f7, #3b82f6)",
            }} />
          </div>
        </div>

        <div className="text-[11px] uppercase tracking-[0.2em] opacity-50 mb-3">I'm checking in as</div>
        <div className="space-y-2">
          {PERSONS.map(p => {
            const ps = stats.byPerson[p.key];
            const pct = ps.total ? Math.round((ps.done / ps.total) * 100) : 0;
            return (
              <button
                key={p.key}
                onClick={() => onSelect(p.key)}
                className="w-full flex items-center gap-4 p-4 rounded-2xl text-left transition-all active:scale-[0.98]"
                style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)" }}
              >
                <div className="w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold" style={{
                  background: p.color, color: "#000",
                }}>
                  {p.initial}
                </div>
                <div className="flex-1">
                  <div className="text-base font-semibold">{p.label}</div>
                  <div className="text-[11px] opacity-60">{p.role}</div>
                </div>
                <div className="text-right">
                  <div className="text-sm tabular-nums">{pct}%</div>
                  <div className="text-[10px] opacity-50 tabular-nums">{ps.done}/{ps.total}</div>
                </div>
              </button>
            );
          })}
        </div>

        {blobId && (
          <div className="mt-8 p-4 rounded-2xl" style={{
            background: "rgba(168,85,247,0.08)",
            border: "1px solid rgba(168,85,247,0.2)",
          }}>
            <div className="flex items-center gap-2 mb-2">
              <Wifi size={12} style={{ color: "#a855f7" }} />
              <div className="text-[10px] uppercase tracking-[0.15em] font-semibold" style={{ color: "#a855f7" }}>Shared list — no login needed</div>
            </div>
            <div className="text-[12px] opacity-80 leading-relaxed mb-3">
              Send this link to anyone helping. They open it on any browser — no accounts.
            </div>
            <div className="flex gap-2 items-center mb-2">
              <div className="flex-1 px-3 py-2 rounded-lg text-[10px] font-mono truncate" style={{
                background: "rgba(0,0,0,0.3)",
                border: "1px solid rgba(255,255,255,0.06)",
              }}>
                {shareLink || `Code: ${blobId}`}
              </div>
              <button
                onClick={copyLink}
                className="px-3 py-2 rounded-lg text-[11px] font-semibold transition-all active:scale-95"
                style={{
                  background: copied ? "#10b981" : "#a855f7",
                  color: copied ? "#000" : "#fff",
                }}
              >
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
            <div className="text-[10px] opacity-50 leading-relaxed">
              Code: <span className="font-mono">{blobId}</span> · Anyone with this can edit.
            </div>
            <button onClick={onResetBlob} className="mt-3 text-[10px] underline opacity-50">
              Start a new shared list
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function BlobSetupScreen({ onCreate, onJoin, error, syncing }) {
  const [joinCode, setJoinCode] = useState("");
  const [mode, setMode] = useState("choose");

  return (
    <div className="min-h-screen flex flex-col" style={{
      background: "radial-gradient(ellipse at top, #1a0b2e 0%, #0a0612 50%, #000 100%)",
      fontFamily: "'Instrument Sans', -apple-system, sans-serif",
      color: "#f5f5f7",
    }}>
      <div className="flex-1 flex flex-col justify-center px-6 py-12 max-w-md mx-auto w-full">
        <div className="text-[10px] uppercase tracking-[0.3em] opacity-50 mb-3">Step 1 of 2</div>
        <div className="text-5xl italic leading-[0.95] mb-3" style={{ fontFamily: "'Instrument Serif', serif" }}>
          Set up your<br/>shared list.
        </div>
        <div className="text-sm opacity-70 mb-10 leading-relaxed">
          Tasks sync between everyone helping. No accounts, no signup.
        </div>

        {mode === "choose" && (
          <div className="space-y-3">
            <button
              onClick={onCreate}
              disabled={syncing}
              className="w-full p-5 rounded-2xl text-left transition-all active:scale-[0.98] disabled:opacity-50"
              style={{ background: "linear-gradient(135deg, #ec4899, #a855f7)", color: "#fff" }}
            >
              <div className="text-[10px] uppercase tracking-[0.2em] opacity-90 mb-1">First person</div>
              <div className="text-lg font-semibold mb-1">Start a new shared list</div>
              <div className="text-[11px] opacity-80">{syncing ? "Creating…" : "Get a link to send to everyone else"}</div>
            </button>
            <button
              onClick={() => setMode("join")}
              className="w-full p-5 rounded-2xl text-left transition-all active:scale-[0.98]"
              style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)" }}
            >
              <div className="text-[10px] uppercase tracking-[0.2em] opacity-60 mb-1">Joining someone</div>
              <div className="text-lg font-semibold mb-1">I have a code or link</div>
              <div className="text-[11px] opacity-60">Enter the code to join an existing list</div>
            </button>
          </div>
        )}

        {mode === "join" && (
          <div>
            <div className="text-[11px] uppercase tracking-[0.15em] opacity-60 mb-2">Paste link or code</div>
            <input
              type="text"
              value={joinCode}
              onChange={(e) => setJoinCode(e.target.value)}
              placeholder="e.g. abc123def456"
              className="w-full px-4 py-3 rounded-xl text-sm font-mono mb-4"
              style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", outline: "none" }}
            />
            <div className="flex gap-2">
              <button
                onClick={() => setMode("choose")}
                className="flex-1 py-3 rounded-xl text-sm font-semibold transition-all active:scale-95"
                style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.08)", color: "#fff" }}
              >
                Back
              </button>
              <button
                onClick={() => {
                  let id = joinCode.trim();
                  if (id.includes("?")) {
                    try {
                      const u = new URL(id);
                      const param = u.searchParams.get(BLOB_ID_PARAM);
                      if (param) id = param;
                    } catch {}
                  }
                  if (id) onJoin(id);
                }}
                disabled={!joinCode.trim()}
                className="flex-[2] py-3 rounded-xl text-sm font-semibold transition-all active:scale-95 disabled:opacity-50"
                style={{ background: "linear-gradient(135deg, #ec4899, #a855f7)", color: "#fff" }}
              >
                Join shared list
              </button>
            </div>
          </div>
        )}

        {error && (
          <div className="mt-6 p-3 rounded-xl text-[12px]" style={{
            background: "rgba(239,68,68,0.1)",
            border: "1px solid rgba(239,68,68,0.3)",
            color: "#fca5a5",
          }}>
            {error}
          </div>
        )}

        <div className="mt-10 text-[10px] opacity-40 leading-relaxed">
          Data is stored on jsonblob.com — a free public service. The code acts like a password.
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
